<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="calcbody">
        <div id="calcbodytop">
            <div id="screen">
                <span>0</span>
            </div>
        </div>
        <div id="calcbodybottom">
            <div id="digits"></div>
            <div id="operators">
                <div id="digit" data-cancel data-val="C"><span>C</span></div>
                <div id="digit" data-round data-val="="><span>=</span></div>
                <div id="digit" data-oper data-val="/"><span>/</span></div>
                <div id="digit" data-oper data-val="*"><span>*</span></div>
                <div id="digit" data-oper data-val="-"><span>-</span></div>
                <div id="digit" data-oper data-val="+"><span>+</span></div>
                <div id="digit" data-round data-val="="><span>=</span></div>
            </div>
        </div>
    </div>
    <script src="js.js"></script>
</body>

</html>
